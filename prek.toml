# Configuration file for `prek`, a git hook framework written in Rust.

# See `https://prek.j178.dev`  for more information.

#:schema `https://www.schemastore.org/prek.json`

fail_fast = false

[[repos]]
repo = "builtin"
hooks = [
    { id = "fix-byte-order-marker" },
    { id = "check-case-conflict" },
    { id = "check-merge-conflict" },
    { id = "check-symlinks" },
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt -- --check", language = "system", files = '\.rs$', pass_filenames = false },
    { id = "typos", name = "typos", entry = "typos", language = "system", files = '\.*$', pass_filenames = false },
    { id = "cargo-check", name = "cargo check", entry = "cargo check --all", language = "system", files = '\.rs$', pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets --all-features --tests --benches -- -D warnings", language = "system", files = '\.rs$', pass_filenames = false },
    # { id = "cargo-test", name = "cargo test", entry = "cargo test --all-features", language = "rust", files = '\.rs$', pass_filenames = false },
]
